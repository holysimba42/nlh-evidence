name: k5b-windows-probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: consume secret on windows
        env:
          BUF_TEST_SECRET: ${{ secrets.BUF_TEST_SECRET }}
        shell: bash
        run: |
          L="${#BUF_TEST_SECRET}"
          H="$(printf '%s' "$BUF_TEST_SECRET" | sha256sum | cut -d' ' -f1)"
          echo "K5_SECRET_CONSUMED_OK len=$L sha=$H"
